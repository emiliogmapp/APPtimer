<!DOCTYPE html>

<body>

<div class="container">

<h1>Arbeidstid</h1>

<div class="card">

<div class="top">

<button class="green" onclick="nyDag()">
+ Ny dag
</button>

<button class="danger" onclick="nullstill()">
Nullstill
</button>

</div>

<div class="table-wrapper">

<table>

<thead>
<tr>
    <th>Dato</th>
    <th>Inn</th>
    <th>Ut</th>
    <th>Arbeidstid</th>
    <th>Mer/Mindre</th>
    <th>Del 2</th>
    <th>Desimal</th>
    <th></th>
</tr>
</thead>

<tbody id="tabell"></tbody>

</table>

</div>

<div class="total-box">

<div>TOTAL MER/MINDRE</div>

<div id="totalMer" class="total-value">
00:00
</div>

</div>

<div class="info">
Normal arbeidstid: <strong>07:30 per dag</strong>
</div>

<div id="status" class="status">
Kobler til databasen...
</div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://blcsronstyddcavlqllb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_G_7u82nBFdTuNdnPJHvNdg_hJ6kxQ2o";

const TABLE =
    "timer";


/* =========================================================
   ARBEIDSTID
========================================================= */

const NORMAL_TID = 450; // 7 timer og 30 minutter

let dager = [];

let lasterData = false;


/* =========================================================
   STATUS
========================================================= */

function settStatus(tekst, type = "") {

    const status =
        document.getElementById("status");

    status.textContent = tekst;

    status.className =
        "status " + type;
}


/* =========================================================
   SUPABASE HEADERS
========================================================= */

function supabaseHeaders() {

    return {

        "apikey": SUPABASE_KEY,

        "Authorization":
            "Bearer " + SUPABASE_KEY,

        "Content-Type":
            "application/json"

    };

}


/* =========================================================
   HENTE DATA FRA SUPABASE
========================================================= */

async function hentData() {

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/" +
                TABLE +
                "?select=id,dato,stemplinger,updated_at&order=dato.asc",
                {
                    method: "GET",
                    headers: supabaseHeaders()
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        /*
           Hvis databasen har data,
           bruker vi databasen.
        */

        if (data.length > 0) {

            dager =
                data.map(rad => ({

                    id:
                        rad.id,

                    dato:
                        rad.dato,

                    stemplinger:
                        Array.isArray(rad.stemplinger)
                        ? rad.stemplinger
                        : [
                            {
                                inn: "",
                                ut: ""
                            }
                        ]

                }));

        }

        /*
           Hvis databasen er tom,
           prøver vi å hente gammel
           localStorage-data og flytte
           den til Supabase.
        */

        else {

            const gammel =
                localStorage.getItem(
                    "arbeidstidData"
                );


            if (gammel) {

                try {

                    dager =
                        JSON.parse(gammel);


                    dager =
                        dager.map(dag => ({

                            id:
                                dag.id ||
                                crypto.randomUUID(),

                            dato:
                                dag.dato,

                            stemplinger:
                                dag.stemplinger ||
                                [
                                    {
                                        inn: "",
                                        ut: ""
                                    }
                                ]

                        }));


                    if (dager.length > 0) {

                        await lagreAlle();

                    }

                }
                catch (e) {

                    dager = [];

                }

            }

        }


        settStatus(
            "Synkronisert",
            "ok"
        );

        vis();

    }
    catch (error) {

        console.error(
            "Feil ved henting:",
            error
        );

        settStatus(
            "Kunne ikke koble til databasen",
            "error"
        );


        /*
           Fallback til lokal lagring
           hvis internett/database ikke
           er tilgjengelig.
        */

        const lokal =
            localStorage.getItem(
                "arbeidstidData"
            );


        if (lokal) {

            try {

                dager =
                    JSON.parse(lokal);

            }
            catch (e) {

                dager = [];

            }

        }


        vis();

    }

}


/* =========================================================
   LAGRE ÉN DAG
========================================================= */

async function lagreDag(dag) {

    if (!dag.id) {

        dag.id =
            crypto.randomUUID();

    }


    const data = {

        id:
            dag.id,

        dato:
            dag.dato,

        stemplinger:
            dag.stemplinger,

        updated_at:
            new Date().toISOString()

    };


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/" +
                TABLE +
                "?on_conflict=id",
                {
                    method: "POST",

                    headers: {

                        ...supabaseHeaders(),

                        "Prefer":
                            "resolution=merge-duplicates,return=minimal"

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        if (!response.ok) {

            const tekst =
                await response.text();

            throw new Error(
                tekst ||
                "HTTP " + response.status
            );

        }


        settStatus(
            "Lagret og synkronisert",
            "ok"
        );


        /*
           Lokal backup.
        */

        localStorage.setItem(
            "arbeidstidData",
            JSON.stringify(dager)
        );


    }
    catch (error) {

        console.error(
            "Feil ved lagring:",
            error
        );


        /*
           Lagre lokalt hvis
           nettverket er nede.
        */

        localStorage.setItem(
            "arbeidstidData",
            JSON.stringify(dager)
        );


        settStatus(
            "Lagret lokalt – ikke synkronisert",
            "error"
        );

    }

}


/* =========================================================
   LAGRE ALLE DAGER
========================================================= */

async function lagreAlle() {

    for (const dag of dager) {

        await lagreDag(dag);

    }

}


/* =========================================================
   DAG
========================================================= */

async function nyDag() {

    const dag = {

        id:
            crypto.randomUUID(),

        dato:
            dagensDato(),

        stemplinger: [

            {
                inn: "",
                ut: ""
            }

        ]

    };


    dager.push(dag);

    vis();

    await lagreDag(dag);

}


/* =========================================================
   DAGENS DATO
========================================================= */

function dagensDato() {

    const d =
        new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            d.getDate()
        ).padStart(2, "0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   MINUTTER
========================================================= */

function tilMinutter(tid) {

    if (!tid)
        return null;

    const deler =
        tid.split(":");

    return (
        Number(deler[0]) * 60 +
        Number(deler[1])
    );

}


/* =========================================================
   FORMATERE TID
========================================================= */

function formatTid(minutter) {

    const negativ =
        minutter < 0;

    minutter =
        Math.abs(
            Math.round(minutter)
        );

    const timer =
        Math.floor(
            minutter / 60
        );

    const min =
        minutter % 60;

    const tekst =
        String(timer).padStart(2, "0")
        +
        ":"
        +
        String(min).padStart(2, "0");

    return negativ
        ? "-" + tekst
        : tekst;

}


/* =========================================================
   KLASSE
========================================================= */

function klasse(verdi) {

    if (verdi > 0)
        return "positive";

    if (verdi < 0)
        return "negative";

    return "zero";

}


/* =========================================================
   BEREGN DAG
========================================================= */

function beregnDag(dag) {

    let arbeid = 0;

    let gyldige = 0;


    dag.stemplinger.forEach(
        stempel => {

            if (
                !stempel.inn ||
                !stempel.ut
            )
                return;


            const inn =
                tilMinutter(
                    stempel.inn
                );

            const ut =
                tilMinutter(
                    stempel.ut
                );


            /*
               Ingen arbeid over midnatt.
            */

            if (ut <= inn)
                return;


            arbeid +=
                ut - inn;

            gyldige++;

        }
    );


    if (gyldige === 0) {

        return {

            arbeid: null,

            mer: null,

            del: null,

            desimal: null

        };

    }


    /*
       7:30 trekkes bare én gang
       per dag.
    */

    const mer =
        arbeid - NORMAL_TID;


    /*
       Del på 2.

       Ved oddetall minutter
       rundes ned mot null.
    */

    const del =
        mer >= 0
            ? Math.floor(
                mer / 2
              )
            : Math.ceil(
                mer / 2
              );


    const desimal =
        del / 60;


    return {

        arbeid,

        mer,

        del,

        desimal

    };

}


/* =========================================================
   ENDRE STEMPEL
========================================================= */

async function endreStempel(
    dagIndex,
    stempelIndex,
    felt,
    verdi
) {

    dager[
        dagIndex
    ].stemplinger[
        stempelIndex
    ][felt] = verdi;


    vis();

    await lagreDag(
        dager[dagIndex]
    );

}


/* =========================================================
   LEGG TIL STEMPEL
========================================================= */

async function leggTilStempel(
    dagIndex
) {

    dager[
        dagIndex
    ].stemplinger.push({

        inn: "",

        ut: ""

    });


    vis();

    await lagreDag(
        dager[dagIndex]
    );

}


/* =========================================================
   SLETT STEMPEL
========================================================= */

async function slettStempel(
    dagIndex,
    stempelIndex
) {

    dager[
        dagIndex
    ].stemplinger.splice(
        stempelIndex,
        1
    );


    /*
       Sørg for at dagen
       alltid har minst én rad.
    */

    if (
        dager[dagIndex]
        .stemplinger.length === 0
    ) {

        dager[dagIndex]
        .stemplinger.push({

            inn: "",

            ut: ""

        });

    }


    vis();

    await lagreDag(
        dager[dagIndex]
    );

}


/* =========================================================
   VIS APP
========================================================= */

function vis() {

    const tabell =
        document.getElementById(
            "tabell"
        );


    tabell.innerHTML = "";


    let totalMer = 0;


    dager.forEach(
        (dag, dagIndex) => {

            const resultat =
                beregnDag(dag);


            if (
                resultat.mer !== null
            ) {

                totalMer +=
                    resultat.mer;

            }


            dag.stemplinger.forEach(
                (
                    stempel,
                    stempelIndex
                ) => {

                    const rad =
                        document.createElement(
                            "tr"
                        );


                    rad.innerHTML = `

<td>

<input
type="date"
value="${dag.dato}"
onchange="
endreDato(
${dagIndex},
this.value
)
">

</td>


<td>

<input
type="time"
min="05:00"
max="18:00"
value="${stempel.inn}"
onchange="
endreStempel(
${dagIndex},
${stempelIndex},
'inn',
this.value
)
">

</td>


<td>

<input
type="time"
min="05:00"
max="18:00"
value="${stempel.ut}"
onchange="
endreStempel(
${dagIndex},
${stempelIndex},
'ut',
this.value
)
">

</td>


<td class="result">

${
    resultat.arbeid !== null
    ? formatTid(resultat.arbeid)
    : "--:--"
}

</td>


<td class="result ${
    resultat.mer !== null
    ? klasse(resultat.mer)
    : ""
}">

${
    resultat.mer !== null
    ? formatTid(resultat.mer)
    : "--:--"
}

</td>


<td class="result ${
    resultat.del !== null
    ? klasse(resultat.del)
    : ""
}">

${
    resultat.del !== null
    ? formatTid(resultat.del)
    : "--:--"
}

</td>


<td class="result ${
    resultat.del !== null
    ? klasse(resultat.del)
    : ""
}">

${
    resultat.desimal !== null
    ? resultat.desimal
        .toFixed(2)
        .replace(".", ",")
    : "--"
}

</td>


<td>

<button
onclick="
slettStempel(
${dagIndex},
${stempelIndex}
)
">

×

</button>

</td>

`;


                    tabell.appendChild(
                        rad
                    );

                }
            );


            /*
               Egen rad under dagens
               stemplinger.
            */

            const dagRad =
                document.createElement(
                    "tr"
                );


            dagRad.className =
                "day-total";


            dagRad.innerHTML = `

<td colspan="3">

<button
onclick="
leggTilStempel(${dagIndex})
">

+ Stempling

</button>

</td>


<td>

${
    resultat.arbeid !== null
    ? formatTid(
        resultat.arbeid
      )
    : "--:--"
}

</td>


<td class="${
    resultat.mer !== null
    ? klasse(resultat.mer)
    : ""
}">

${
    resultat.mer !== null
    ? formatTid(
        resultat.mer
      )
    : "--:--"
}

</td>


<td>

${
    resultat.del !== null
    ? formatTid(
        resultat.del
      )
    : "--:--"
}

</td>


<td>

${
    resultat.desimal !== null
    ? resultat.desimal
        .toFixed(2)
        .replace(".", ",")
    : "--"
}

</td>


<td></td>

`;


            tabell.appendChild(
                dagRad
            );

        }
    );


    document.getElementById(
        "totalMer"
    ).textContent =
        formatTid(totalMer);

}


/* =========================================================
   ENDRE DATO
========================================================= */

async function endreDato(
    dagIndex,
    dato
) {

    dager[
        dagIndex
    ].dato = dato;


    vis();

    await lagreDag(
        dager[dagIndex]
    );

}


/* =========================================================
   NULLSTILL
========================================================= */

async function nullstill() {

    if (
        !confirm(
            "Vil du slette alle registrerte dager?"
        )
    ) {

        return;

    }


    /*
       Slett fra Supabase først.
    */

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/" +
                TABLE +
                "?id=not.is.null",
                {
                    method: "DELETE",

                    headers:
                        supabaseHeaders()
                }
            );


        if (!response.ok) {

            throw new Error(
                "Kunne ikke slette data"
            );

        }

    }
    catch (error) {

        console.error(error);

        settStatus(
            "Kunne ikke slette fra databasen",
            "error"
        );

        return;

    }


    dager = [];


    localStorage.removeItem(
        "arbeidstidData"
    );


    vis();


    settStatus(
        "Alle dager er slettet",
        "ok"
    );


    /*
       Lag en ny tom dag.
    */

    await nyDag();

}


/* =========================================================
   AUTOMATISK SYNKRONISERING
========================================================= */

async function oppdaterFraDatabase() {

    if (lasterData)
        return;


    /*
       Ikke hent data mens brukeren
       holder på å gjøre endringer.
    */

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/" +
                TABLE +
                "?select=id,dato,stemplinger,updated_at&order=dato.asc",
                {
                    method: "GET",
                    headers:
                        supabaseHeaders()
                }
            );


        if (!response.ok)
            return;


        const data =
            await response.json();


        /*
           Bare oppdater hvis databasen
           faktisk har data.
        */

        if (data.length > 0) {

            const nyeDager =
                data.map(rad => ({

                    id:
                        rad.id,

                    dato:
                        rad.dato,

                    stemplinger:
                        Array.isArray(
                            rad.stemplinger
                        )
                        ? rad.stemplinger
                        : [
                            {
                                inn: "",
                                ut: ""
                            }
                        ]

                }));


            /*
               Sammenlign data før vi
               tegner skjermen på nytt.
            */

            const gammel =
                JSON.stringify(dager);

            const ny =
                JSON.stringify(nyeDager);


            if (gammel !== ny) {

                dager =
                    nyeDager;

                vis();

                settStatus(
                    "Oppdatert fra server",
                    "ok"
                );

            }

        }

    }
    catch (error) {

        console.log(
            "Synkronisering venter..."
        );

    }

}


/*
   Sjekk databasen hvert 10. sekund.
*/

setInterval(
    oppdaterFraDatabase,
    10000
);


/* =========================================================
   START
========================================================= */

async function startApp() {

    lasterData = true;

    await hentData();

    lasterData = false;


    /*
       Hvis databasen er helt tom
       og det ikke finnes lokal data,
       opprett én ny dag.
    */

    if (dager.length === 0) {

        await nyDag();

    }

}


/*
   Start appen.
*/

startApp();

</script>

</body>
</html>
