<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APPtimer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #111827;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.top {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.green {
    background: #16a34a;
}

.danger {
    background: #dc2626;
}

.blue {
    background: #2563eb;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

th {
    background: #1e293b;
    color: white;
    padding: 12px;
}

td {
    padding: 8px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
}

input {
    padding: 9px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 16px;
}

input[type="date"] {
    width: 145px;
}

input[type="time"] {
    width: 110px;
}

.result {
    font-weight: bold;
}

.positive {
    color: #15803d;
}

.negative {
    color: #dc2626;
}

.zero {
    color: #475569;
}

.day-total {
    background: #f8fafc;
    font-weight: bold;
}

.total-box {
    margin-top: 25px;
    padding: 18px;
    background: #eff6ff;
    border-radius: 10px;
    text-align: center;
}

.total-value {
    font-size: 28px;
    font-weight: bold;
}

.status {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}

.ok {
    color: #15803d;
}

.error {
    color: #dc2626;
}

.loading {
    color: #2563eb;
}

@media(max-width:600px) {
    .container {
        padding: 8px;
    }

    .card {
        padding: 10px;
    }

    .top {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Arbeidstid</h1>

<div class="card">

<div class="top">

<button class="green" onclick="nyDag()">
+ Ny dag
</button>

<button class="danger" onclick="nullstill()">
Nullstill
</button>

<button class="blue" onclick="hentData()">
↻ Oppdater
</button>

</div>

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Dato</th>
<th>Inn</th>
<th>Ut</th>
<th>Arbeidstid</th>
<th>Mer/Mindre</th>
<th>Del 2</th>
<th>Desimal</th>
<th></th>
</tr>
</thead>

<tbody id="tabell"></tbody>

</table>

</div>

<div class="total-box">

<div>TOTAL MER/MINDRE</div>

<div id="totalMer" class="total-value">
00:00
</div>

</div>

<div style="text-align:center;margin-top:15px;">
Normal arbeidstid: <strong>07:30 per dag</strong>
</div>

<div id="status" class="status loading">
Kobler til Supabase...
</div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://blcsronstyddcavlqllb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_G_7u82nBFdTuNdnPJHvNdg_hJ6kxQ2o";

const TABLE = "timer";

const NORMAL_TID = 450;

let dager = [];

let laster = false;

let lagrer = false;


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function headers() {

    return {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
    };

}


/* =====================================================
   STATUS
===================================================== */

function visStatus(tekst, klasse = "") {

    const el =
        document.getElementById("status");

    el.textContent = tekst;

    el.className =
        "status " + klasse;

}


/* =====================================================
   HENT DATA FRA SUPABASE
===================================================== */

async function hentData() {

    if (laster || lagrer)
        return;

    laster = true;

    visStatus(
        "Henter data...",
        "loading"
    );

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/" +
            TABLE +
            "?select=id,date,start,slutt,stemplinger,updated_at&order=date.asc,id.asc";


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    headers: headers(),
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            const feil =
                await response.text();

            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                feil
            );

        }


        const data =
            await response.json();


        dager =
            data.map(rad => {

                let stemplinger =
                    rad.stemplinger;


                if (
                    !Array.isArray(stemplinger)
                    ||
                    stemplinger.length === 0
                ) {

                    stemplinger = [

                        {
                            inn:
                                rad.start || "",

                            ut:
                                rad.slutt || ""
                        }

                    ];

                }


                return {

                    id:
                        rad.id,

                    dato:
                        rad.date,

                    stemplinger:
                        stemplinger

                };

            });


        vis();


        visStatus(
            "✓ Synkronisert",
            "ok"
        );

    }
    catch (error) {

        console.error(
            "Supabase-feil:",
            error
        );

        visStatus(
            "Feil ved tilkobling til Supabase",
            "error"
        );

    }
    finally {

        laster = false;

    }

}


/* =====================================================
   LAGRE
===================================================== */

async function lagreDag(dag) {

    lagrer = true;

    visStatus(
        "Lagrer...",
        "loading"
    );


    const første =
        dag.stemplinger[0] || {};


    const data = {

        date:
            dag.dato,

        start:
            første.inn || "",

        slutt:
            første.ut || "",

        stemplinger:
            dag.stemplinger,

        updated_at:
            new Date().toISOString()

    };


    try {

        let response;


        /* NY RAD */

        if (!dag.id) {

            response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/" +
                    TABLE,
                    {

                        method: "POST",

                        headers: {

                            ...headers(),

                            "Prefer":
                                "return=representation"

                        },

                        body:
                            JSON.stringify(data)

                    }
                );


            if (!response.ok) {

                const feil =
                    await response.text();

                throw new Error(
                    "HTTP " +
                    response.status +
                    ": " +
                    feil
                );

            }


            const resultat =
                await response.json();


            if (
                resultat.length > 0
            ) {

                dag.id =
                    resultat[0].id;

            }

        }

        /* OPPDATER EKSISTERENDE */

        else {

            response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/" +
                    TABLE +
                    "?id=eq." +
                    encodeURIComponent(
                        dag.id
                    ),
                    {

                        method: "PATCH",

                        headers: {

                            ...headers(),

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify(data)

                    }
                );


            if (!response.ok) {

                const feil =
                    await response.text();

                throw new Error(
                    "HTTP " +
                    response.status +
                    ": " +
                    feil
                );

            }

        }


        visStatus(
            "✓ Lagret",
            "ok"
        );

    }
    catch (error) {

        console.error(
            "Lagringsfeil:",
            error
        );

        visStatus(
            "Kunne ikke lagre",
            "error"
        );

    }
    finally {

        lagrer = false;

    }

}


/* =====================================================
   NY DAG
===================================================== */

async function nyDag() {

    const dag = {

        id: null,

        dato:
            dagensDato(),

        stemplinger: [

            {
                inn: "",
                ut: ""
            }

        ]

    };


    dager.push(dag);

    vis();


    await lagreDag(dag);

}


/* =====================================================
   DAGENS DATO
===================================================== */

function dagensDato() {

    const d =
        new Date();

    return (
        d.getFullYear()
        + "-"
        + String(
            d.getMonth() + 1
        ).padStart(2, "0")
        + "-"
        + String(
            d.getDate()
        ).padStart(2, "0")
    );

}


/* =====================================================
   TID TIL MINUTTER
===================================================== */

function tilMinutter(tid) {

    if (!tid)
        return null;

    const deler =
        tid.split(":");

    return (
        Number(deler[0]) * 60
        +
        Number(deler[1])
    );

}


/* =====================================================
   FORMAT TID
===================================================== */

function formatTid(minutter) {

    const negativ =
        minutter < 0;


    minutter =
        Math.abs(
            Math.round(minutter)
        );


    const timer =
        Math.floor(
            minutter / 60
        );


    const min =
        minutter % 60;


    const tekst =
        String(timer).padStart(2,"0")
        +
        ":"
        +
        String(min).padStart(2,"0");


    return negativ
        ? "-" + tekst
        : tekst;

}


/* =====================================================
   KLASSE
===================================================== */

function klasse(verdi) {

    if (verdi > 0)
        return "positive";

    if (verdi < 0)
        return "negative";

    return "zero";

}


/* =====================================================
   BEREGN DAG
===================================================== */

function beregnDag(dag) {

    let arbeid = 0;

    let gyldige = 0;


    dag.stemplinger.forEach(
        stempel => {

            if (
                !stempel.inn ||
                !stempel.ut
            )
                return;


            const inn =
                tilMinutter(
                    stempel.inn
                );


            const ut =
                tilMinutter(
                    stempel.ut
                );


            if (ut <= inn)
                return;


            arbeid +=
                ut - inn;


            gyldige++;

        }
    );


    if (gyldige === 0) {

        return {

            arbeid: null,

            mer: null,

            del: null,

            desimal: null

        };

    }


    const mer =
        arbeid - NORMAL_TID;


    const del =
        mer >= 0
        ? Math.floor(mer / 2)
        : Math.ceil(mer / 2);


    return {

        arbeid: arbeid,

        mer: mer,

        del: del,

        desimal: del / 60

    };

}


/* =====================================================
   ENDRE STEMPEL
===================================================== */

async function endreStempel(
    dagIndex,
    stempelIndex,
    felt,
    verdi
) {

    dager[
        dagIndex
    ].stemplinger[
        stempelIndex
    ][felt] = verdi;


    vis();


    await lagreDag(
        dager[dagIndex]
    );

}


/* =====================================================
   ENDRE DATO
===================================================== */

async function endreDato(
    dagIndex,
    dato
) {

    dager[
        dagIndex
    ].dato = dato;


    vis();


    await lagreDag(
        dager[dagIndex]
    );

}


/* =====================================================
   LEGG TIL STEMPEL
===================================================== */

async function leggTilStempel(
    dagIndex
) {

    dager[
        dagIndex
    ].stemplinger.push({

        inn: "",

        ut: ""

    });


    vis();


    await lagreDag(
        dager[dagIndex]
    );

}


/* =====================================================
   SLETT STEMPEL
===================================================== */

async function slettStempel(
    dagIndex,
    stempelIndex
) {

    dager[
        dagIndex
    ].stemplinger.splice(
        stempelIndex,
        1
    );


    if (
        dager[
            dagIndex
        ].stemplinger.length === 0
    ) {

        dager[
            dagIndex
        ].stemplinger.push({

            inn: "",

            ut: ""

        });

    }


    vis();


    await lagreDag(
        dager[dagIndex]
    );

}


/* =====================================================
   SLETT ALLE
===================================================== */

async function nullstill() {

    if (
        !confirm(
            "Vil du slette alle registrerte dager?"
        )
    ) {

        return;

    }


    lagrer = true;


    visStatus(
        "Sletter...",
        "loading"
    );


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/" +
                TABLE +
                "?id=not.is.null",
                {

                    method: "DELETE",

                    headers: headers()

                }
            );


        if (!response.ok) {

            const feil =
                await response.text();

            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                feil
            );

        }


        dager = [];


        vis();


        visStatus(
            "✓ Alle dager er slettet",
            "ok"
        );

    }
    catch (error) {

        console.error(
            "Slettefeil:",
            error
        );

        visStatus(
            "Kunne ikke slette",
            "error"
        );

    }
    finally {

        lagrer = false;

    }

}


/* =====================================================
   VIS APP
===================================================== */

function vis() {

    const tabell =
        document.getElementById(
            "tabell"
        );


    tabell.innerHTML = "";


    let totalMer = 0;


    dager.forEach(
        (dag, dagIndex) => {

            const resultat =
                beregnDag(dag);


            if (
                resultat.mer !== null
            ) {

                totalMer +=
                    resultat.mer;

            }


            dag.stemplinger.forEach(
                (
                    stempel,
                    stempelIndex
                ) => {

                    const rad =
                        document.createElement(
                            "tr"
                        );


                    rad.innerHTML = `

<td>

<input
type="date"
value="${dag.dato || ""}"
onchange="
endreDato(
${dagIndex},
this.value
)
">

</td>

<td>

<input
type="time"
min="00:00"
max="23:59"
value="${stempel.inn || ""}"
onchange="
endreStempel(
${dagIndex},
${stempelIndex},
'inn',
this.value
)
">

</td>

<td>

<input
type="time"
min="00:00"
max="23:59"
value="${stempel.ut || ""}"
onchange="
endreStempel(
${dagIndex},
${stempelIndex},
'ut',
this.value
)
">

</td>

<td class="result">

${
    resultat.arbeid !== null
    ? formatTid(resultat.arbeid)
    : "--:--"
}

</td>

<td class="result ${
    resultat.mer !== null
    ? klasse(resultat.mer)
    : ""
}">

${
    resultat.mer !== null
    ? formatTid(resultat.mer)
    : "--:--"
}

</td>

<td class="result ${
    resultat.del !== null
    ? klasse(resultat.del)
    : ""
}">

${
    resultat.del !== null
    ? formatTid(resultat.del)
    : "--:--"
}

</td>

<td class="result ${
    resultat.del !== null
    ? klasse(resultat.del)
    : ""
}">

${
    resultat.desimal !== null
    ? resultat.desimal
        .toFixed(2)
        .replace(".", ",")
    : "--"
}

</td>

<td>

<button
class="danger"
onclick="
slettStempel(
${dagIndex},
${stempelIndex}
)
">

×

</button>

</td>

`;


                    tabell.appendChild(
                        rad
                    );

                }
            );


            const dagRad =
                document.createElement(
                    "tr"
                );


            dagRad.className =
                "day-total";


            dagRad.innerHTML = `

<td colspan="3">

<button
onclick="
leggTilStempel(
${dagIndex}
)
">

+ Stempling

</button>

</td>

<td>

${
    resultat.arbeid !== null
    ? formatTid(resultat.arbeid)
    : "--:--"
}

</td>

<td class="${
    resultat.mer !== null
    ? klasse(resultat.mer)
    : ""
}">

${
    resultat.mer !== null
    ? formatTid(resultat.mer)
    : "--:--"
}

</td>

<td>

${
    resultat.del !== null
    ? formatTid(resultat.del)
    : "--:--"
}

</td>

<td>

${
    resultat.desimal !== null
    ? resultat.desimal
        .toFixed(2)
        .replace(".", ",")
    : "--"
}

</td>

<td></td>

`;


            tabell.appendChild(
                dagRad
            );

        }
    );


    document.getElementById(
        "totalMer"
    ).textContent =
        formatTid(totalMer);

}


/* =====================================================
   AUTOMATISK SYNKRONISERING
===================================================== */

setInterval(
    function() {

        if (
            !laster &&
            !lagrer
        ) {

            hentData();

        }

    },
    5000
);


/* =====================================================
   START
===================================================== */

hentData();

</script>

</body>
</html>
